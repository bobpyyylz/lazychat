[package]
license = "GPL-3.0-only"
name = "client-core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Enables only loopback HTTP and test identity setup for our local fixture.
test-fixture = []

[dependencies]
anyhow = "1"
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "bundled-sqlite", "rustls-aws-lc-rs", "sso-login"] }
matrix-sdk-crypto = "=0.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
url = "2"

[[example]]
name = "fixture_smoke"
required-features = ["test-fixture"]
